[package]
name = "qaqh-gpui"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "QAQ-Harness GPUI 桌面前端(RingingV2 客户端)"

[[bin]]
name = "qaqh-gpui"
path = "src/main.rs"

[lints.clippy]
string_slice = "deny"

[features]
# Local native acceptance driver; deliberately absent from release builds.
acceptance = []

[dependencies]
futures = "0.3"
base64 = "0.22"
# gpui 基座:longbridge/gpui-kit 对 zed gpui 的 crates.io 快照重发布(gpui-pre-*),
# 精确 pin——caret 会随周更快照漂移破坏编译(gpui-kit #3156 的教训)。
#   gpui-pre 0.3.11 @ 2026-11-02,zed main 快照,与原 vendor(e21ff1b @ 2026-11-04)同源;
#   包内 lib 名与原版一致(gpui/gpui_platform),业务代码零改动。
#   弃用 ../gpui path vendor:快照已把依赖规整回 crates.io,原 5 条 zed fork patch 一并删除。
# 拆平台版结构:gpui 是平台无关核心,Linux 后端经 gpui_platform(wayland/x11)接线。
# 本机为 Wayland 会话且无 libxkbcommon-x11-dev(无 sudo),x11 后端无法链接——
# wayland-only 是本机的正确配置;要 x11:apt install libxkbcommon-x11-dev 后加回。
gpui = { package = "gpui-pre", version = "=0.3.11", default-features = false, features = [
    "font-kit",
    "wayland",
] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["wayland"] }
# 组件库(Apache-2.0,与本项目许可兼容):Button/Modal/Popover/Table/Dock 等 60+ 件。
# 精确 pin 与 gpui-pre 快照咬合;升版必须连同 gpui-pre pin 一起动(见 gpui-kit 的 pin 纪律)。
# tree-sitter-languages/decimal/inspector/syntect features 全不启用:高亮继续用本仓 highlight.rs。
gpui-component = "=0.9.0"
# 组件库图标包(Lucide,rust-embed 内嵌):窗口 AssetSource 注册 gpui_kit_assets::Assets,
# 不注册则组件的菜单/图标一律空白。
gpui-kit-assets = "0.9.0"
# RingingV2 传输权威实现(与 qaqh-tui 同路:跨仓 path 依赖,后端仓必须与该相对路径共存)。
# 协议类型经它转出,前端零自建、零转换层。
qaqh-client = { path = "../qaqh-backend/crates/qaqh-client" }
# 契约类型直用(store 字段直接持有 TimelineEntry/ToolCallView 等),非转换层。
qaqh-ringing-contract = { path = "../qaqh-backend/crates/qaqh-ringing-contract" }
# ModelSelection/SettingValue wire 类型(session.settings.patch 组装用,零转换层)。
qaqh-types = { path = "../qaqh-backend/crates/qaqh-types" }
qaqh-config-api = { path = "../qaqh-backend/crates/qaqh-config-api" }
qaqh-profile = { path = "../qaqh-backend/crates/qaqh-profile" }
# Markdown 流式渲染(M4):pulldown-cmark 事件流,MIT/Apache。
pulldown-cmark = { version = "0.13", default-features = false }
# AST 代码高亮(M5):官方 highlighter + 各语言 grammar(MIT 系)。
tree-sitter-highlight = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-json = "0.24"
tree-sitter-bash = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 仅用 tokio::time::sleep(桥线程等待重试);runtime 复用 qaqh-client 的全局运行时。
tokio = { version = "1", default-features = false, features = ["time"] }

# 内存受限环境(可用 ~1.5Gi):dev profile 压低编译峰值——
# 16 个 codegen 单元压低单 crate 编译峰值,limited 调试信息压低产物与链接期峰值。
[profile.dev]
incremental = true
codegen-units = 16
split-debuginfo = "unpacked"
debug = "limited"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 16
strip = true
