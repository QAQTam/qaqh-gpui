[package]
name = "qaqh-gpui"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "QAQ-Harness GPUI 桌面前端(RingingV2 客户端)"

[[bin]]
name = "qaqh-gpui"
path = "src/main.rs"

[lints.clippy]
string_slice = "deny"

[features]
# Local native acceptance driver; deliberately absent from release builds.
acceptance = []

[dependencies]
futures = "0.3"
base64 = "0.22"
# gpui 固定在本地检出的 ../gpui 仓库:
#   https://github.com/QAQTam/gpui-vendor @ d1520011e6204b95b320ee40a5a6b11879082426
#   vendor 源码取自 zed-industries/zed @ e21ff1b。
# 拆平台版结构:gpui 是平台无关核心,Linux 后端经 gpui_platform(wayland/x11)接线。
# 本机为 Wayland 会话且无 libxkbcommon-x11-dev(无 sudo),x11 后端无法链接——
# wayland-only 是本机的正确配置;要 x11:apt install libxkbcommon-x11-dev 后加回。
gpui = { path = "../gpui/crates/gpui", default-features = false, features = [
    "font-kit",
    "wayland",
] }
gpui_platform = { path = "../gpui/crates/gpui_platform", features = ["wayland"] }
# RingingV2 传输权威实现(与 qaqh-tui 同路:跨仓 path 依赖,后端仓必须与该相对路径共存)。
# 协议类型经它转出,前端零自建、零转换层。
qaqh-client = { path = "../qaqh-backend/crates/qaqh-client" }
# 契约类型直用(store 字段直接持有 TimelineEntry/ToolCallView 等),非转换层。
qaqh-ringing-contract = { path = "../qaqh-backend/crates/qaqh-ringing-contract" }
# ModelSelection/SettingValue wire 类型(session.settings.patch 组装用,零转换层)。
qaqh-types = { path = "../qaqh-backend/crates/qaqh-types" }
qaqh-config-api = { path = "../qaqh-backend/crates/qaqh-config-api" }
qaqh-profile = { path = "../qaqh-backend/crates/qaqh-profile" }
# Markdown 流式渲染(M4):pulldown-cmark 事件流,MIT/Apache。
pulldown-cmark = { version = "0.13", default-features = false }
# AST 代码高亮(M5):官方 highlighter + 各语言 grammar(MIT 系)。
tree-sitter-highlight = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-json = "0.24"
tree-sitter-bash = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 仅用 tokio::time::sleep(桥线程等待重试);runtime 复用 qaqh-client 的全局运行时。
tokio = { version = "1", default-features = false, features = ["time"] }

[patch.crates-io]
# 与 ../gpui workspace 保持逐字一致:跨 workspace 时 [patch] 不传播,缺失会让
# calloop/async-process 等编译到上游版本而失败。
windows-capture = { git = "https://github.com/zed-industries/windows-capture.git", rev = "f0d6c1b6691db75461b732f6d5ff56eed002eeb9" }
khronos-egl = { git = "https://github.com/zed-industries/khronos-egl", rev = "42214b36347b108fd9630ca6254b96dde59e04fe" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }

# 内存受限环境(可用 ~1.5Gi):与 ../gpui workspace 同款的 dev profile——
# 16 个 codegen 单元压低单 crate 编译峰值,limited 调试信息压低产物与链接期峰值。
[profile.dev]
incremental = true
codegen-units = 16
split-debuginfo = "unpacked"
debug = "limited"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 16
strip = true
