# QAQHarness GPUI 前端 workspace。成员划分与后端仓 crates/qaqh-* 惯例对齐;
# 前端 crate 一律 qaqh-gpui-* 前缀:后端仓已有 qaqh-session/qaqh-workspace 等同名包,
# 同一 cargo 图内重名是硬错误。
[workspace]
resolver = "3"
members = ["crates/qaqh-gpui"]
# 默认产物 = 桌面应用:裸 cargo build/check/test 与 --features acceptance 的口径不变。
default-members = ["crates/qaqh-gpui"]

[workspace.package]
# 3.0 线基线:日期占 patch 位(与 qaqh-backend 各 crate 的 3.0.YYYYMMDD 口径一致);
# 展示版本 = 本基线 + "-g{12 位哈希}",由 bin crate 的 build.rs 构建期现算(QAQH_VERSION),
# 哈希随提交走,不在 Cargo.toml 里写死。
version = "3.0.20261109"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.lints.clippy]
string_slice = "deny"

[workspace.dependencies]
# ---- 前端内部 crate ----
qaqh-gpui-wire = { path = "crates/qaqh-gpui-wire" }

# ---- gpui 基座 ----
# longbridge/gpui-kit 对 zed gpui 的 crates.io 快照重发布(gpui-pre-*),
# 精确 pin——caret 会随周更快照漂移破坏编译(gpui-kit #3156 的教训)。
#   gpui-pre 0.3.11 @ 2026-11-02,zed main 快照,与原 vendor(e21ff1b @ 2026-11-04)同源;
#   包内 lib 名与原版一致(gpui/gpui_platform),业务代码零改动。
# 拆平台版结构:gpui 是平台无关核心,Linux 后端经 gpui_platform(wayland/x11)接线;
# Windows 后端由 gpui_platform 的 cfg(target_os="windows") 自动接 gpui-pre-windows,无需特征。
# wayland/x11 在 gpui-pre 本体上是空标记特征;windows-manifest 在 Windows 嵌 DPI manifest。
gpui = { package = "gpui-pre", version = "=0.3.11", default-features = false, features = [
    "font-kit",
    "wayland",
    "windows-manifest",
] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["wayland"] }
# 组件库(Apache-2.0):Button/Modal/Popover/Table/Dock 等 60+ 件。
# 精确 pin 与 gpui-pre 快照咬合;升版必须连同 gpui-pre pin 一起动(pin 纪律)。
# tree-sitter-languages/decimal/inspector/syntect features 全不启用:高亮用本仓 highlight.rs。
gpui-component = "=0.9.0"
# 组件库图标包(Lucide,rust-embed 内嵌):窗口 AssetSource 注册 gpui_kit_assets::Assets,
# 不注册则组件的菜单/图标一律空白。
gpui-kit-assets = "0.9.0"

# ---- 后端 path 依赖(相对 workspace 根,与 qaqh-tui 同路;后端仓必须与该相对路径共存) ----
# RingingV2 传输权威实现。协议类型经它转出,前端零自建、零转换层。
# 【复线 2026-11-13】后端 main f1b5fc78 已含 ADR-0014 A–G,工作区叠加 ADR-0015 goal
# 面与 widget_context;协议重新对齐,退役 ../qaqh-backend-snap 快照(目录已不存在)。
qaqh-client = { path = "../qaqh-backend/crates/qaqh-client" }
# 契约类型直用(store 字段直接持有 TimelineEntry/ToolCallView 等),非转换层。
qaqh-ringing-contract = { path = "../qaqh-backend/crates/qaqh-ringing-contract" }
# ModelSelection/SettingValue wire 类型(session.settings.patch 组装用,零转换层)。
qaqh-types = { path = "../qaqh-backend/crates/qaqh-types" }
qaqh-config-api = { path = "../qaqh-backend/crates/qaqh-config-api" }
qaqh-profile = { path = "../qaqh-backend/crates/qaqh-profile" }

# ---- 第三方 ----
futures = "0.3"
base64 = "0.22"
# Markdown 流式渲染(M4):pulldown-cmark 事件流,MIT/Apache。
pulldown-cmark = { version = "0.13", default-features = false }
# AST 代码高亮(M5):官方 highlighter + 各语言 grammar(MIT 系)。
tree-sitter-highlight = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-json = "0.24"
tree-sitter-bash = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 仅用 tokio::time::sleep(桥线程等待重试);runtime 复用 qaqh-client 的全局运行时。
tokio = { version = "1", default-features = false, features = ["time"] }

# 内存受限环境:dev profile 压低编译峰值——
# 16 个 codegen 单元压低单 crate 编译峰值,limited 调试信息压低产物与链接期峰值。
# workspace 级 profile 对全部成员生效;拆 crate 后单 crate 峰值只减不增。
[profile.dev]
incremental = true
codegen-units = 16
split-debuginfo = "unpacked"
debug = "limited"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 16
strip = true
