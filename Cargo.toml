# QAQHarness GPUI 前端 workspace。成员划分与后端仓 crates/qaqh-* 惯例对齐;
# 前端 crate 一律 qaqh-gpui-* 前缀:后端仓已有 qaqh-session/qaqh-workspace 等同名包,
# 同一 cargo 图内重名是硬错误。
[workspace]
resolver = "3"
members = [
    "crates/qaqh-gpui",
    "crates/qaqh-gpui-wire",
    "crates/qaqh-gpui-kit",
    "crates/qaqh-gpui-render",
    "crates/qaqh-gpui-session",
    "crates/qaqh-gpui-shell",
]
# 默认产物 = 桌面应用:裸 cargo build/check/test 与 --features acceptance 的口径不变。
default-members = ["crates/qaqh-gpui"]

[workspace.package]
version = "5.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.lints.clippy]
string_slice = "deny"

[workspace.dependencies]
# ---- 前端内部 crate ----
qaqh-gpui-wire = { path = "crates/qaqh-gpui-wire" }
qaqh-gpui-kit = { path = "crates/qaqh-gpui-kit" }
qaqh-gpui-render = { path = "crates/qaqh-gpui-render" }
qaqh-gpui-session = { path = "crates/qaqh-gpui-session" }
qaqh-gpui-shell = { path = "crates/qaqh-gpui-shell" }

# ---- gpui-kit 统一基座(纯原生,零 WebView) ----
# longbridge/gpui-kit 单一顶层伞包(Apache-2.0):内部严格锁死同源的
# gpui-pre(=0.3.14) + gpui-pre-platform(=0.3.14) + gpui-base(0.11.0)
# + gpui-component(0.11.0) + gpui-kit-assets(0.11.0),避免 4 个散包手工 pin 漂移。
# 默认挂上游 gpui-pre 后端;不启用 tree-sitter-languages/decimal/inspector/syntect/speech。
gpui-kit = "=0.11.0"

# ---- 后端 path 依赖(相对 workspace 根,与 qaqh-tui 同路;后端仓必须与该相对路径共存) ----
# 传输实现(本地发现 + V3 客户端 + 全局 tokio 运行时)。协议类型一律来自
# `qaqh-ringing-v3`;前端零自建、零转换层。
qaqh-client = { path = "../qaqh-backend/crates/qaqh-client" }
# RingingV3 契约域:前端直接持有其强类型,零前端 DTO、零转换层。
qaqh-ringing-v3 = { path = "../qaqh-backend/crates/qaqh-ringing-v3" }
qaqh-core-vocab = { path = "../qaqh-backend/crates/qaqh-core-vocab" }
qaqh-v3-transport = { path = "../qaqh-backend/crates/qaqh-v3-transport" }
# 配置文档(providers.toml / config.toml 的落地模型);协议面一律走 V3。
qaqh-profile = { path = "../qaqh-backend/crates/qaqh-profile" }

# ---- 第三方 ----
futures = "0.3"
# AST 代码高亮(M5):官方 highlighter + 各语言 grammar(MIT 系)。
tree-sitter-highlight = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-json = "0.24"
tree-sitter-bash = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# URI percent-decode 复用已锁定的 percent-encoding 2.3.2(零新增传递依赖)。
percent-encoding = "2"
# 仅用 tokio::time::sleep(桥线程等待重试);runtime 复用 qaqh-client 的全局运行时。
tokio = { version = "1", default-features = false, features = ["time"] }
# 完整 VT100/xterm/ConPTY 虚拟终端内核(Apache-2.0,仅用无头 Term + vte::ansi::Processor,不启本地 PTY)。
alacritty_terminal = "0.26"
# V3 `ShellRequest::Write` 的载荷类型(裸 PTY 字节);与后端同版本线。
bytes = "1"

# 内存受限环境:dev profile 压低编译峰值——
# 16 个 codegen 单元压低单 crate 编译峰值,limited 调试信息压低产物与链接期峰值。
# workspace 级 profile 对全部成员生效;拆 crate 后单 crate 峰值只减不增。
[profile.dev]
incremental = true
codegen-units = 16
split-debuginfo = "unpacked"
debug = "limited"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 16
strip = true
